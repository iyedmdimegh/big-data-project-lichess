apiVersion: 1

datasources:
  - name: ChessDB
    uid: chessdb-postgres
    type: postgres
    access: proxy
    url: postgres:5432
    database: chessdb
    user: ${POSTGRES_USER}
    secureJsonData:
      password: ${POSTGRES_PASSWORD}
    jsonData:
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
    isDefault: true
    editable: true
